  - title: Agent swarms and the new model economics
    url: https://cursor.com/blog/agent-swarm-model-economics
    category: Multi-agent
    kind: article
    note: "Cursor (Wilson Lin, 2026-07-20): swarm peaks around 1,000 commits/second. Names split-brain design (two planners implement the same concept differently) and planner contention. Mitigation via prompting, shared design docs, compile-checked references, and a reconciler."
    tags:
      - swarms
      - cursor
    added: "2026-09-04"
    featured: true
